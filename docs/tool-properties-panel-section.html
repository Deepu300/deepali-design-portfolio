<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Properties Panel · interactive section</title>

<!--
  The Tool Properties Panel, on its own.

  A replica of the Illustrator panel with four pillar filters. Hovering a chip
  lights the regions that pillar owns and dims the rest; clicking pins it.
  No dependencies, no build step, no images: every icon is inline SVG.

  Dropping it into a page
  - Copy the <style>, the .tpp markup, and the <script>. Everything is scoped
    under .tpp so it will not touch the rest of the page.
  - Type inherits --tp-sans and --tp-mono when the host page defines them
    (the case study does), and falls back to system faces when it does not.
  - Colours are the project's Illustrator swatches, set per pillar in one place:
    the [data-pillar] rules below.

  Wiring a new pillar or region
  - Add a chip with data-pillar="yourkey" and a [data-pillar="yourkey"] colour
    rule, then tag any .tpp-block or .tpp-note with the same key. The script
    reads the attribute, so nothing else needs editing.
-->

<style>
  body {
    margin: 0;
    padding: 48px 24px;
    background: #f6f7f3;
    display: flex;
    justify-content: center;
  }

  /* ---------- tokens ---------------------------------------------------- */

  .tpp {
    --ink: #151f38;
    --body: #5d6570;
    --muted: #9aa0a8;
    --faint: #b6bac0;
    --paper: #fff;
    --card: #f6f7f3;
    --line: #e6e7e1;
    --line-2: #d9dad3;
    --purple: #714c8f;
    --amber: #ffc240;

    /* panel chrome, kept close to Illustrator's own light UI */
    --ui-bg: #f4f4f2;
    --ui-line: #e2e2de;
    --ui-edge: #dcdcd8;
    --ui-text: #3d3d3d;
    --ui-sub: #6a6a6a;

    --sans: var(--tp-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    --mono: var(--tp-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

    width: 100%;
    max-width: 780px;
    font-family: var(--sans);
    color: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  .tpp *,
  .tpp *::before,
  .tpp *::after { box-sizing: border-box; }

  /* one place for the pillar colours: tone (solid), pale (lit background),
     ink (legible text and icons) */
  .tpp [data-pillar="gaps"]   { --tone: #e3caeb; --tone-pale: #f3e9f7; --tone-ink: #714c8f; }
  .tpp [data-pillar="newer"]  { --tone: #bccbea; --tone-pale: #e3e9f6; --tone-ink: #4d5f86; }
  .tpp [data-pillar="future"] { --tone: #becfbc; --tone-pale: #e4ebe3; --tone-ink: #556354; }
  .tpp [data-pillar="nudges"] { --tone: #e7dcc8; --tone-pale: #f5f0e8; --tone-ink: #866a2f; }

  /* ---------- pillar chips --------------------------------------------- */

  .tpp-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 18px;
  }

  .tpp-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
    color: var(--body);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.3s var(--ease), color 0.3s var(--ease),
      background 0.3s var(--ease), transform 0.3s var(--ease);
  }

  .tpp-chip:hover { transform: translateY(-2px); border-color: var(--line-2); }
  .tpp-chip:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
  .tpp-chip.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .tpp-sw {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--tone);
    box-shadow: inset 0 0 0 1px rgba(21, 31, 56, 0.16);
  }

  /* ---------- stage ---------------------------------------------------- */

  .tpp-stage {
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr);
    gap: 28px;
    align-items: center;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
  }

  /* ---------- the panel ------------------------------------------------ */

  .tpp-panel {
    border: 1px solid #d6d6d2;
    border-radius: 8px;
    background: var(--ui-bg);
    overflow: hidden;
    box-shadow: 0 20px 40px -30px rgba(21, 31, 56, 0.5);
  }

  .tpp-block {
    padding: 12px 12px 14px;
    border-bottom: 1px solid var(--ui-line);
    transition: background 0.4s var(--ease), opacity 0.4s var(--ease);
  }

  .tpp-block.is-lit { background: var(--tone-pale); }
  .tpp-block.is-dim { opacity: 0.34; }

  .tpp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .tpp-label { font-size: 11.5px; color: var(--ui-text); }

  .tpp-tools { display: flex; gap: 8px; color: var(--ui-sub); }
  .tpp-tools svg {
    width: 13px;
    height: 13px;
    transition: transform 0.35s var(--ease), color 0.35s var(--ease);
  }
  .tpp-tools svg:hover { transform: translateY(-2px); color: var(--purple); }

  /* primary shapes */
  .tpp-shapes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

  .tpp-shape {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 1px solid var(--ui-edge);
    border-radius: 4px;
    background: #fbfbfa;
    color: #4a4a4a;
    cursor: pointer;
    transition: transform 0.3s var(--ease), border-color 0.3s var(--ease),
      background 0.3s var(--ease), color 0.3s var(--ease);
  }
  .tpp-shape svg { width: 17px; height: 17px; }
  .tpp-shape:hover {
    transform: translateY(-2px) scale(1.04);
    border-color: var(--purple);
    color: var(--purple);
    background: #fff;
  }
  .tpp-shape.is-active { background: #e8e8e6; border-color: #c4c4c0; }

  /* generative prompt */
  .tpp-prompt {
    border: 1px solid var(--ui-edge);
    border-radius: 4px;
    background: #fff;
    padding: 8px 9px;
    font-size: 10.5px;
    line-height: 1.5;
    color: #8a8a8a;
    font-style: italic;
  }
  .tpp-typed { color: var(--ui-text); font-style: normal; }
  .tpp-caret {
    display: inline-block;
    width: 1px;
    height: 11px;
    margin-left: 1px;
    background: var(--purple);
    vertical-align: -2px;
    animation: tpp-blink 1s steps(2, start) infinite;
  }
  @keyframes tpp-blink { to { visibility: hidden; } }

  .tpp-btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }

  .tpp-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border: 1px solid #cfcfcb;
    border-radius: 4px;
    background: linear-gradient(#fff, #f2f2f0);
    color: #333;
    font-family: var(--sans);
    font-size: 10px;
    cursor: pointer;
    transition: transform 0.3s var(--ease), border-color 0.3s var(--ease),
      box-shadow 0.3s var(--ease);
  }
  .tpp-btn:hover {
    transform: translateY(-1px);
    border-color: var(--purple);
    box-shadow: 0 6px 14px -10px rgba(113, 76, 143, 0.9);
  }
  .tpp-btn svg { width: 11px; height: 11px; }

  /* variations */
  .tpp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

  .tpp-var {
    height: 34px;
    display: grid;
    place-items: center;
    border: 1px solid var(--ui-edge);
    border-radius: 3px;
    background: #fff;
    color: #555;
    transition: transform 0.3s var(--ease), border-color 0.3s var(--ease);
  }
  .tpp-var svg { width: 30px; height: 20px; }
  .tpp-var:hover { transform: translateY(-2px); border-color: #c08fcf; }

  /* extensions */
  .tpp-ext { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }

  .tpp-ext-item {
    padding: 6px 2px;
    border-radius: 4px;
    color: #4a4a4a;
    cursor: pointer;
    transition: background 0.3s var(--ease), transform 0.3s var(--ease);
  }
  .tpp-ext-item svg { width: 22px; height: 16px; }
  .tpp-ext-item span { display: block; font-size: 9px; margin-top: 3px; color: #5a5a5a; }
  .tpp-ext-item:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-2px); }

  /* modifier rows */
  .tpp-block--rows { padding: 0; }

  .tpp-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    border-bottom: 1px solid #e6e6e2;
    font-size: 11px;
    color: var(--ui-text);
    cursor: pointer;
    transition: background 0.3s var(--ease), padding-left 0.3s var(--ease);
  }
  .tpp-row:last-child { border-bottom: 0; }
  .tpp-row:hover { background: rgba(255, 255, 255, 0.85); padding-left: 16px; }
  .tpp-chev { width: 9px; height: 9px; color: #8a8a8a; transition: transform 0.3s var(--ease); }
  .tpp-row:hover .tpp-chev { transform: translateX(2px); }
  .tpp-row-icon { width: 13px; height: 13px; color: var(--ui-sub); }

  /* idle nudge */
  .tpp-nudge {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 0;
    padding: 2px 0;
    font-size: 10.5px;
    line-height: 1.55;
    color: #4a4326;
  }
  .tpp-dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    margin-top: 4px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 rgba(255, 194, 64, 0.85);
    animation: tpp-pulse 2.6s var(--ease) infinite;
  }
  @keyframes tpp-pulse {
    60% { box-shadow: 0 0 0 7px rgba(255, 194, 64, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 194, 64, 0); }
  }

  .tpp-foot {
    display: flex;
    justify-content: space-between;
    padding: 7px 12px;
    background: #ececeb;
    font-size: 9.5px;
    color: #8a8a8a;
  }

  /* ---------- annotations --------------------------------------------- */

  .tpp-notes { display: flex; flex-direction: column; gap: 4px; }

  .tpp-note {
    padding: 12px 14px;
    border: 0;
    border-left: 2px solid var(--tone);
    border-radius: 0 8px 8px 0;
    background: var(--paper);
    text-align: left;
    font-family: var(--sans);
    cursor: pointer;
    transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
  }
  .tpp-note:hover { transform: translateX(4px); box-shadow: 0 14px 28px -24px rgba(21, 31, 56, 0.6); }
  .tpp-note:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }

  .tpp-note-k {
    margin: 0 0 5px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tone-ink);
  }
  .tpp-note-v { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink); }

  .tpp-hint {
    margin: 14px 0 0;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* ---------- responsive + reduced motion ----------------------------- */

  @media (max-width: 720px) {
    .tpp-stage { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tpp *,
    .tpp *::before,
    .tpp *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="tpp" id="toolPropertiesPanel">

  <div class="tpp-legend" role="group" aria-label="Highlight the panel by pillar">
    <button type="button" class="tpp-chip" data-pillar="gaps" aria-pressed="false">
      <span class="tpp-sw" aria-hidden="true"></span>Bridging gaps
    </button>
    <button type="button" class="tpp-chip" data-pillar="newer" aria-pressed="false">
      <span class="tpp-sw" aria-hidden="true"></span>Newer capabilities
    </button>
    <button type="button" class="tpp-chip" data-pillar="future" aria-pressed="false">
      <span class="tpp-sw" aria-hidden="true"></span>Future technologies
    </button>
    <button type="button" class="tpp-chip" data-pillar="nudges" aria-pressed="false">
      <span class="tpp-sw" aria-hidden="true"></span>Help and nudges
    </button>
  </div>

  <div class="tpp-stage">

    <div class="tpp-panel">

      <!-- primary shapes: bridging gaps -->
      <section class="tpp-block" data-pillar="gaps">
        <div class="tpp-head">
          <span class="tpp-label">Shapes</span>
          <span class="tpp-tools">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" role="img" aria-label="Move">
              <path d="M10 2v16M2 10h16M10 2 8 4.5M10 2l2 2.5M10 18l-2-2.5M10 18l2-2.5M2 10l2.5-2M2 10l2.5 2M18 10l-2.5-2M18 10l-2.5 2"/>
            </svg>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" role="img" aria-label="3D">
              <path d="M10 2.5 17 6v8l-7 3.5L3 14V6l7-3.5Z"/><path d="M3 6l7 3.5L17 6M10 9.5v8"/>
            </svg>
          </span>
        </div>
        <div class="tpp-shapes">
          <span class="tpp-shape is-active" title="Rectangle">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="3.5" width="13" height="13"/></svg>
          </span>
          <span class="tpp-shape" title="Ellipse">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="10" cy="10" r="6.5"/></svg>
          </span>
          <span class="tpp-shape" title="Triangle">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M10 3.5 17 16.5H3L10 3.5Z"/></svg>
          </span>
          <span class="tpp-shape" title="Star">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M10 3l2.1 4.6 5 .5-3.7 3.4 1 4.9L10 14l-4.4 2.4 1-4.9L2.9 8.1l5-.5L10 3Z"/></svg>
          </span>
          <span class="tpp-shape" title="Line">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 16 16 4"/></svg>
          </span>
        </div>
      </section>

      <!-- generative shape: future technologies -->
      <section class="tpp-block" data-pillar="future">
        <div class="tpp-head"><span class="tpp-label">Generative Shape</span></div>
        <div class="tpp-prompt">
          Describe the shape you want:<br>
          <span class="tpp-typed" id="tppTyped">A flower with 3 petals</span><i class="tpp-caret" aria-hidden="true"></i>
        </div>
        <div class="tpp-btns">
          <span class="tpp-btn" title="Magic brush">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M3 17 13 7M12 3l.8 2.2L15 6l-2.2.8L12 9l-.8-2.2L9 6l2.2-.8L12 3Z"/>
              <path d="M16.5 11l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5.5-1.3Z"/>
            </svg>
          </span>
          <span class="tpp-btn">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M7 10h6M10 7v6" stroke-linecap="round"/>
            </svg>
            Generate
          </span>
        </div>
      </section>

      <!-- variations: future technologies -->
      <section class="tpp-block" data-pillar="future">
        <div class="tpp-head"><span class="tpp-label">Variations</span></div>
        <div class="tpp-grid" id="tppVariations" aria-hidden="true"></div>
      </section>

      <!-- extensions: newer capabilities -->
      <section class="tpp-block" data-pillar="newer">
        <div class="tpp-head"><span class="tpp-label">Extensions</span></div>
        <div class="tpp-ext">
          <span class="tpp-ext-item">
            <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 16V8c0-4 22-4 22 0v8H4Z"/></svg>
            <span>Bend</span>
          </span>
          <span class="tpp-ext-item">
            <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5h12l4 11H5L9 5Z"/></svg>
            <span>Scale</span>
          </span>
          <span class="tpp-ext-item">
            <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5h18l-6 11H3L9 5Z"/></svg>
            <span>Skew</span>
          </span>
          <span class="tpp-ext-item">
            <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 16V8l3.5 3L11 8l3.5 3L18 8l3.5 3L25 8v8H4Z"/></svg>
            <span>Zigzag</span>
          </span>
        </div>
      </section>

      <!-- modifiers: bridging gaps -->
      <section class="tpp-block tpp-block--rows" data-pillar="gaps">
        <div class="tpp-row">
          <span class="tpp-chev"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2.5 8 6l-4 3.5" stroke-linecap="round"/></svg></span>
          <span class="tpp-row-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="7" width="7" height="7"/><rect x="11" y="7" width="7" height="7" stroke-dasharray="2 2"/></svg></span>
          Repeat
        </div>
        <div class="tpp-row">
          <span class="tpp-chev"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2.5 8 6l-4 3.5" stroke-linecap="round"/></svg></span>
          <span class="tpp-row-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="10" cy="10" r="7" stroke-dasharray="2 2"/><circle cx="10" cy="10" r="3.4"/></svg></span>
          Offset
        </div>
        <div class="tpp-row">
          <span class="tpp-chev"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2.5 8 6l-4 3.5" stroke-linecap="round"/></svg></span>
          <span class="tpp-row-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="14" height="14"/><path d="M8 3v14M13 3v14M3 8h14M3 13h14"/></svg></span>
          Grid
        </div>
        <div class="tpp-row">
          <span class="tpp-chev"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2.5 8 6l-4 3.5" stroke-linecap="round"/></svg></span>
          <span class="tpp-row-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="9" height="9"/><rect x="8" y="8" width="9" height="9"/></svg></span>
          Combine
        </div>
      </section>

      <!-- idle time: small help and nudges -->
      <section class="tpp-block" data-pillar="nudges">
        <p class="tpp-nudge">
          <span class="tpp-dot" aria-hidden="true"></span>
          Waiting on a render? Shift while dragging keeps the shape true.
        </p>
      </section>

      <div class="tpp-foot"><span>100%</span><span>Artboard 1</span></div>
    </div>

    <div class="tpp-notes">
      <button type="button" class="tpp-note" data-pillar="gaps">
        <p class="tpp-note-k">Bridging gaps</p>
        <p class="tpp-note-v">The primary shape row and the Repeat, Offset, Grid and Combine modifiers sit at the top and bottom of the panel, where the old flyout menu used to hide them.</p>
      </button>
      <button type="button" class="tpp-note" data-pillar="newer">
        <p class="tpp-note-k">Newer capabilities</p>
        <p class="tpp-note-v">Extensions turn bend, scale, skew and zigzag into one widget, and the 3D toggle opens polyhedron shapes.</p>
      </button>
      <button type="button" class="tpp-note" data-pillar="future">
        <p class="tpp-note-k">Future technologies</p>
        <p class="tpp-note-v">Generative Shape takes a written description and returns variations that can be dropped straight onto the canvas.</p>
      </button>
      <button type="button" class="tpp-note" data-pillar="nudges">
        <p class="tpp-note-k">Small help and nudges</p>
        <p class="tpp-note-v">Idle moments become a quiet tip near the cursor instead of dead time.</p>
      </button>
      <p class="tpp-hint">Hover a pillar to see where it lives in the panel</p>
    </div>

  </div>
</div>

<script>
(function () {
  var root = document.getElementById("toolPropertiesPanel");
  if (!root) return;

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var list = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

  /* ---- variation presets: nine outlines, drawn rather than pasted ------ */
  var VARIATIONS = [
    "M6 4h18a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z",
    "M2 8a4 4 0 0 1 4-4h22v12H6a4 4 0 0 1-4-4V8Z",
    "M2 4h22a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H2V4Z",
    "M8 4h14l6 12H2L8 4Z",
    "M6 4h18l4 12H2L6 4Z",
    "M2 4h22l4 12H2V4Z",
    "M2 4h20l6 12H2V4Z",
    "M8 4h20v12H2L8 4Z",
    "M2 4h18c6 0 8 12 8 12H2V4Z"
  ];
  var grid = document.getElementById("tppVariations");
  if (grid) {
    grid.innerHTML = VARIATIONS.map(function (d) {
      return '<span class="tpp-var"><svg viewBox="0 0 30 20" fill="none" stroke="currentColor" ' +
        'stroke-width="1.2"><path d="' + d + '"/></svg></span>';
    }).join("");
  }

  /* ---- the filter: hover previews a pillar, click pins it ------------- */
  var chips = list(".tpp-chip");
  var notes = list(".tpp-note");
  var blocks = list(".tpp-block");
  var pinned = null;
  var hovered = null;

  function paint() {
    var key = hovered || pinned;
    chips.forEach(function (chip) {
      var mine = chip.getAttribute("data-pillar") === key;
      chip.classList.toggle("is-on", mine);
      chip.setAttribute("aria-pressed", chip.getAttribute("data-pillar") === pinned ? "true" : "false");
    });
    blocks.forEach(function (block) {
      var mine = block.getAttribute("data-pillar") === key;
      block.classList.toggle("is-lit", !!key && mine);
      block.classList.toggle("is-dim", !!key && !mine);
    });
  }

  function bind(el) {
    var key = el.getAttribute("data-pillar");
    el.addEventListener("mouseenter", function () { hovered = key; paint(); });
    el.addEventListener("focus", function () { hovered = key; paint(); });
    el.addEventListener("mouseleave", function () { hovered = null; paint(); });
    el.addEventListener("blur", function () { hovered = null; paint(); });
    el.addEventListener("click", function () {
      pinned = pinned === key ? null : key;
      hovered = null;
      paint();
    });
  }
  chips.forEach(bind);
  notes.forEach(bind);

  /* clicking away releases a pinned pillar */
  document.addEventListener("click", function (e) {
    if (!pinned || root.contains(e.target)) return;
    pinned = null;
    paint();
  });

  /* ---- the prompt types itself once it is on screen ------------------- */
  var typed = document.getElementById("tppTyped");
  if (typed && !reduce) {
    var text = typed.textContent;
    typed.textContent = "";
    var run = function () {
      var i = 0;
      (function tick() {
        i += 1;
        typed.textContent = text.slice(0, i);
        if (i < text.length) setTimeout(tick, 62);
      })();
    };
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          io.unobserve(entry.target);
          setTimeout(run, 500);
        });
      }, { threshold: 0.5 });
      io.observe(root);
    } else {
      run();
    }
  }

  paint();
})();
</script>
